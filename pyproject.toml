[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team-coordinator"
version = "0.1.0"
description = "Local, subscription-backed coding teams with GitHub tracking and independent reviews"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
agent-team = "agent_team.cli:main"

[tool.setuptools.packages.find]
include = ["agent_team*"]
